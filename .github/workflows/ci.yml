name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-checks:
    name: Windows checks
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          architecture: x64
          cache: pip
          cache-dependency-path: apps/api/requirements-win-py311.lock

      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Create Python environment
        run: >-
          python -m venv apps/api/.venv311

      - name: Install locked Python dependencies
        run: >-
          .\apps\api\.venv311\Scripts\python.exe -m pip install --require-hashes --only-binary=:all: -r apps/api/requirements-win-py311.lock

      - name: Install API without resolving dependencies
        run: >-
          .\apps\api\.venv311\Scripts\python.exe -m pip install --no-deps --no-build-isolation -e "./apps/api[dev]"

      - name: Check Python dependencies
        run: >-
          .\apps\api\.venv311\Scripts\python.exe -m pip check

      - name: Install locked frontend dependencies
        run: >-
          npm.cmd --prefix apps/web ci

      - name: Check repository configuration
        run: >-
          .\apps\api\.venv311\Scripts\python.exe scripts/doctor.py

      - name: Run API, script, and UI tests and build
        run: >-
          .\apps\api\.venv311\Scripts\python.exe scripts/checks.py --stage manual

      - name: Validate public dataset template
        run: >-
          .\apps\api\.venv311\Scripts\python.exe scripts/validate_example_dataset.py docs/templates/example_dataset_template.xlsx --allow-empty-template
