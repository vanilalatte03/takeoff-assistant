[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "takeoff-assistant-api"
version = "0.1.0"
description = "FastAPI backend skeleton for the PDF drawing finish takeoff assistant MVP."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "pydantic-settings>=2.0,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "PyMuPDF>=1.24,<2.0",
  "openpyxl>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=9.0.3,<10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
